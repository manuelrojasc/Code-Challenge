openapi: 3.0.0
info:
  title: Microservicio de Alumnos
  version: 1.0.0
  description: Microservicio para gestionar alumnos usando Spring Boot y MongoDB.

paths:
  /alumnos:
    post:
      summary: Crear un nuevo alumno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Alumno'
      responses:
        '201':
          description: Alumno creado exitosamente
        '500':
          description: Ocurrio un error al guardar los datos
        '400':
          description: los datos ingresasos son incorrectos
    get:
      summary: Obtener alumnos filtrados por estado
      parameters:
        - name: status
          in: query
          description: Estado del alumno (activo o inactivo)
          required: true
          schema:
            type: string
            enum: [activo, inactivo]
      responses:
        '200':
          description: Lista de alumnos filtrados por estado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alumno'
        '400':
          description: el parametro ingresado es incorrecto

components:
  schemas:
    Alumno:
      type: object
      required:
        - nombre
        - apellido
        - estado
        - edad
        - id
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        nombre:
          type: string
          pattern: '^[A-Za-z ]+$'
          example: Manuel
        apellido:
          type: string
          pattern: '^[A-Za-z ]+$'
          example: Rojas Curitima
        estado:
          type: string
          enum: [activo, inactivo]
        edad:
          type: integer
          minimum: 1
          maximum: 120